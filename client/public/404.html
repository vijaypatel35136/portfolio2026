<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vijay Bhesaniya | Portfolio</title>
    <script>
      // Single Page Application (SPA) redirect for GitHub Pages with HashRouter
      var l = window.location;
      var repoPath = '/portfolio2026/';
      var subPath = l.pathname.substring(repoPath.length);
      if (subPath) {
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repoPath + '#/' + subPath + l.search);
      } else {
        l.replace(repoPath);
      }
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
